<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070707">
<title>FIVE:AM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#070707;--bg2:#101010;--line:#2a2a2a;--text:#f3f1ec;--muted:#8f8b83;--red:#c8102e;--paper:#efece4;--ink:#161616}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Barlow,sans-serif;font-size:16px;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070707;z-index:9}
.boot b{font-family:Anton,Impact,sans-serif;font-size:64px;font-weight:400;letter-spacing:.04em}
.boot b i{color:var(--red);font-style:normal}.boot span{font-family:"Share Tech Mono",monospace;letter-spacing:.4em;color:var(--muted);font-size:12px}
.bar{width:120px;height:2px;background:#222;margin-top:16px}.bar i{display:block;height:100%;width:0;background:var(--red);animation:l 1s steps(10) forwards}
@keyframes l{to{width:100%}}
.screen{min-height:100dvh;padding:28px 18px 40px}.auth{max-width:440px;margin:auto}
.mark{font-family:Anton,Impact,sans-serif;font-size:36px;letter-spacing:.03em}.mark i{color:var(--red);font-style:normal}
.kicker{font-family:"Share Tech Mono",monospace;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-size:11px;margin:6px 0 18px}
h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:28px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 16px;line-height:1.4}
label span{display:block;font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input,select{width:100%;background:#101010;border:1px solid var(--line);padding:12px;border-radius:0;margin-bottom:12px}
.dots{display:flex;gap:8px;margin:8px 0 14px}.dots i{width:38px;height:48px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:"Share Tech Mono",monospace;background:#101010}
.dots i.on{border-color:var(--text)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{height:56px;background:#101010;border:1px solid var(--line);font-family:"Share Tech Mono",monospace;font-size:22px}
.keys button:active{border-color:var(--red)}
.btn{border:1px solid var(--line);background:transparent;padding:12px 14px;text-transform:uppercase;letter-spacing:.08em;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.block{width:100%;margin-top:12px}.btn.slim{padding:8px 10px;font-size:16px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px 0}
.err{color:#ffb4be;font-family:"Share Tech Mono",monospace;font-size:13px;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.meta{text-align:right;font-family:"Share Tech Mono",monospace;font-size:12px;color:var(--muted)}.meta b{display:block;color:var(--text);font-weight:400;font-size:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#333;margin-right:6px}.dot.on{background:var(--red)}
.main{padding:14px 14px 120px}
.switch{display:flex;border:1px solid var(--line);margin-bottom:12px}.switch button{flex:1;background:transparent;border:0;padding:10px;color:var(--muted);font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em}
.switch button.on{background:var(--text);color:#070707}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.card{position:relative;text-align:left;background:#101010;border:1px solid var(--line);min-height:96px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.card.paid{border-left:3px solid var(--red)}.card .nm{font-family:"Barlow Condensed",sans-serif;font-size:22px;text-transform:uppercase;line-height:.95}
.card .pr{font-family:"Share Tech Mono",monospace;color:var(--muted);font-size:13px}
.badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;min-width:22px;height:22px;display:grid;place-items:center;font-family:"Share Tech Mono",monospace;font-size:13px}
.lot{position:fixed;left:0;right:0;bottom:0;background:#0c0c0c;border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:5}
.admin .lot{bottom:54px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{border:1px solid var(--line);padding:4px 6px;display:flex;gap:6px;align-items:center}
.chip button{width:28px;height:28px;background:transparent;border:1px solid var(--line)}
.lot .row{display:flex;gap:8px}.lot .row button{flex:1}
.closed{border:1px dashed #3a3a3a;text-align:center;padding:36px 12px;margin-top:20px}
.closed strong{display:block;font-family:Anton,Impact,sans-serif;font-size:36px;letter-spacing:.04em}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b0b0b;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:transparent;border:0;color:var(--muted);padding:10px 2px;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:13px}
.nav button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--red)}.nav .ping{color:var(--red)}
.ticket{background:var(--paper);color:var(--ink);padding:18px 16px;margin:10px 0}
.ticket .who{font-family:Anton,Impact,sans-serif;font-size:30px}.ticket .who i{color:var(--red);font-style:normal}
.ticket .sub{font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ticket table{width:100%;border-collapse:collapse}.ticket td{padding:6px 0;border-top:1px dashed #c8c3b8}.ticket td.n{text-align:right;font-family:"Share Tech Mono",monospace}
.ticket .tot td{border-top:2px solid #161616;font-weight:600}
.panel{border:1px solid var(--line);padding:12px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:"Share Tech Mono",monospace;font-size:11px;border:1px solid var(--line);padding:2px 6px;text-transform:uppercase}
.tag.wait{color:#e2b657}.muted{color:var(--muted)}.mono{font-family:"Share Tech Mono",monospace}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.days button{background:transparent;border:1px solid var(--line);padding:12px 0;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}
.days button.on{background:var(--text);color:#070707}
.chart{background:#101010;border:1px solid var(--line);padding:8px}canvas{width:100%;height:auto}
.toast{position:fixed;left:10px;right:10px;top:10px;background:var(--text);color:#111;padding:12px;display:flex;justify-content:space-between;gap:8px;z-index:20}
.toast[hidden]{display:none}.toast button{background:#111;color:#fff;border:0;padding:8px}
#boot[hidden],#app[hidden]{display:none !important}
.sync{font-family:"Share Tech Mono",monospace;font-size:11px;color:#8f8b83}
.check{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
table.plain{width:100%;border-collapse:collapse;font-size:14px}table.plain td{padding:6px 2px;border-bottom:1px solid var(--line)}
.void{opacity:.4;text-decoration:line-through}
.live{display:flex;justify-content:space-between;border:1px solid var(--line);padding:8px 10px;font-family:"Share Tech Mono",monospace;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="boot" id="boot"><b>FIVE<i>:</i>AM</b><span>GUICHET</span><div class="bar"><i></i></div></div>
<div id="app" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
const KEY="fiveam-v1";
const DAYS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const NIGHT=[20,21,22,23,0,1,2,3,4,5,6,7];
const STROKES=["#f3f1ec","#c8102e","#8f8b83","#d8d2c6"];
function seed(){
  const types=["Entrée conso|1200|paid","Entrée bouteille|10000|paid","Entrée seul|1000|paid","Vestiaires|200|paid","Entrée sur ticket|0|free","Entrée staff|0|free","Entrée Thierry|0|free","Entrée client vip|0|free"];
  return {seq:20,users:[],types:types.map((s,i)=>{const [name,cents,kind]=s.split("|");return {id:i+1,name,priceCents:+cents,kind,active:true,sort:i}}),sessions:[],entries:[],settings:{openDays:[5,6,0],cutoff:8}};
}
function db(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
let pushTimer=null, remoteRev=0, pushing=false;
function save(d){
  d.rev=Date.now();
  localStorage.setItem(KEY,JSON.stringify(d));
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>pushDb(d),250);
}
const ROOM="fam7k2porte";
const KV="https://keyvalue.immanuel.co/api/KeyVal";
async function kvGet(key){
  const r=await fetch(KV+"/GetValue/"+ROOM+"/"+key);
  if(!r.ok) return null;
  const t=await r.text();
  if(!t||t.includes("ExceptionMessage")) return null;
  return JSON.parse(t);
}
async function kvSet(key,value){
  await fetch(KV+"/UpdateValue/"+ROOM+"/"+key+"/"+encodeURIComponent(value),{method:"POST",body:""});
}
async function pushDb(d){
  if(pushing){clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushDb(db()),400); return}
  pushing=true;
  try{
    const raw=JSON.stringify(d);
    const size=350;
    const parts=[];
    for(let i=0;i<raw.length;i+=size) parts.push(raw.slice(i,i+size));
    await kvSet("n", String(parts.length));
    for(let i=0;i<parts.length;i++) await kvSet("p"+i, parts[i]);
    await kvSet("rev", String(d.rev||Date.now()));
    remoteRev=d.rev||Date.now();
    const el=document.getElementById("sync"); if(el) el.textContent="En ligne";
  }catch(e){const el=document.getElementById("sync"); if(el) el.textContent="Hors ligne"}
  pushing=false;
}
async function pullDb(){
  const rev=await kvGet("rev");
  if(!rev||Number(rev)===remoteRev) return null;
  const n=Number(await kvGet("n"));
  if(!n) return null;
  let raw="";
  for(let i=0;i<n;i++){const part=await kvGet("p"+i); if(part==null) return null; raw+=part}
  const data=JSON.parse(raw);
  remoteRev=Number(rev);
  localStorage.setItem(KEY,JSON.stringify(data));
  return data;
}
function nid(d){return d.seq++}
const S={user:null,screen:"login",pin:"",pin2:"",step:1,err:"",name:"",mode:localStorage.getItem("fam_mode")||"lot",lot:{},view:"caisse",sessionId:null,detail:false,range:"week",compare:[],revealed:{},temp:null,recovery:""};
const app=document.getElementById("app");
const toastEl=document.getElementById("toast");
function esc(s){const a=String.fromCharCode(38);return String(s??"").replace(/&/g,a+"amp;").replace(/</g,a+"lt;").replace(/>/g,a+"gt;").replace(/"/g,a+"quot;")}
function euro(c){return (c/100).toLocaleString("fr-FR",{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2})+" €"}
function frDate(iso){if(!iso)return "";const [y,m,d]=iso.split("-").map(Number);return new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d)))}
function frTime(iso){return new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23",timeZone:"Europe/Paris"}).format(new Date(iso))}
function clock(){return new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:"Europe/Paris"}).format(new Date())}
function zoned(date){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).formatToParts(date);const g=t=>p.find(x=>x.type===t).value;return {date:g("year")+"-"+g("month")+"-"+g("day"),hour:+g("hour")}}
function businessDate(){const z=zoned(new Date());if(z.hour<db().settings.cutoff){const d=new Date(z.date+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}return z.date}
function weekdayOf(iso){return new Date(iso+"T12:00:00Z").getUTCDay()}
function hourOf(iso){return zoned(new Date(iso)).hour}
function active(d,sid){return d.entries.filter(e=>e.sessionId===sid&&!e.voided)}
function sum(list){const by=new Map();let qty=0,cents=0;const hours=Array(24).fill(0);for(const e of list){qty+=e.qty;cents+=e.totalCents;hours[hourOf(e.at)]+=e.qty;const r=by.get(e.typeName)||{name:e.typeName,qty:0,cents:0};r.qty+=e.qty;r.cents+=e.totalCents;by.set(e.typeName,r)}return {qty,cents,hours,byType:[...by.values()]}}
function toast(t,undo){toastEl.hidden=false;toastEl.innerHTML="<span>"+esc(t)+"</span>"+(undo?'<button data-act="undo">Annuler</button>':"");clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.hidden=true,undo?8000:2200)}
function dots(v){return '<div class="dots">'+Array.from({length:6},(_,i)=>'<i class="'+(i<v.length?"on":"")+'">'+(i<v.length?"•":"")+"</i>").join("")+"</div>"}
function keys(){return '<div class="keys">'+[1,2,3,4,5,6,7,8,9,"C",0,"⌫"].map(k=>'<button data-act="key" data-k="'+k+'">'+k+"</button>").join("")+"</div>"}
function mark(){return '<div class="mark">FIVE<i>:</i>AM</div>'}
function render(){
  const d=db();
  if(!d.users.some(u=>u.role==="admin")&&S.screen!=="setup")S.screen="setup";
  const views={setup:viewSetup,login:viewLogin,request:viewRequest,pending:viewPending,changepin:viewChange,app:S.user&&S.user.role==="admin"?viewAdmin:viewStaff};
  app.innerHTML=(views[S.screen]||viewLogin)();
  if(S.screen==="app"&&S.user&&S.user.role==="admin"&&S.view==="heures")draw();
}
function viewSetup(){return '<div class="screen"><div class="auth">'+mark()+'<div class="kicker">Première fois</div><h2>Ton compte</h2><p class="lead">Toi seul verras les totaux. Les autres téléphones ouvrent le même lien et ne voient que les boutons.</p><label><span>Nom</span><input id="name" value="'+esc(S.name)+'"></label>'+dots(S.pin)+keys()+'<div class="err">'+esc(S.err)+'</div><button class="btn red block" data-act="setup">Créer</button></div></div>'}
function viewLogin(){return '<div class="screen"><div class="auth">'+mark()+'<div class="kicker">Guichet</div><h2>Ouverture</h2><p class="lead">Même lien sur tous les téléphones. Les entrées se partagent.</p><label><span>Nom</span><input id="name" value="'+esc(S.name)+'"></label>'+dots(S.pin)+keys()+'<div class="err">'+esc(S.err)+'</div><button class="btn red block" data-act="login">Entrer</button><div style="display:flex;justify-content:space-between"><button class="link" data-act="goto" data-to="request">Demander un accès</button></div></div></div>'}
function viewRequest(){return '<div class="screen"><div class="auth">'+mark()+'<div class="kicker">Équipe</div><h2>Demande</h2><p class="lead">Nom + PIN à 6 chiffres. Le gérant valide.</p><label><span>Nom</span><input id="name" value="'+esc(S.name)+'"></label><div class="muted">'+(S.step===1?"Choisis le PIN":"Confirme le PIN")+"</div>"+dots(S.step===1?S.pin:S.pin2)+keys()+'<div class="err">'+esc(S.err)+'</div><button class="btn red block" data-act="request">Envoyer</button><button class="link" data-act="goto" data-to="login">Retour</button></div></div>'}
function viewPending(){return '<div class="screen"><div class="auth">'+mark()+'<h2>En attente</h2><p class="lead">'+esc(S.name)+', le gérant doit valider.</p><button class="btn block" data-act="goto" data-to="login">Retour</button></div></div>'}
function viewChange(){return '<div class="screen"><div class="auth">'+mark()+'<h2>Nouveau PIN</h2><p class="lead">Le PIN temporaire ne sert qu’une fois.</p>'+dots(S.pin)+keys()+'<div class="err">'+esc(S.err)+'</div><button class="btn red block" data-act="changepin">Enregistrer</button></div></div>'}
function openSessions(){return db().sessions.filter(s=>s.status==="open")}
function cards(){
  const types=db().types.filter(t=>t.active).sort((a,b)=>a.sort-b.sort);
  const card=t=>'<button class="card '+t.kind+'" data-act="add" data-id="'+t.id+'">'+(S.lot[t.id]?'<span class="badge">'+S.lot[t.id]+"</span>":"")+'<span class="nm">'+esc(t.name)+'</span><span class="pr">'+(t.kind==="free"?"Gratuit":euro(t.priceCents))+"</span></button>";
  const paid=types.filter(t=>t.kind==="paid"), free=types.filter(t=>t.kind==="free");
  return (paid.length?'<div class="lab">Payant</div><div class="grid">'+paid.map(card).join("")+"</div>":"")+(free.length?'<div class="lab">Gratuit</div><div class="grid">'+free.map(card).join("")+"</div>":"");
}
function lotBar(){
  if(S.mode==="direct")return '<div class="lot"><div class="muted">Chaque touche est validée</div></div>';
  const lines=Object.entries(S.lot).filter(([,q])=>q>0);
  const n=lines.reduce((a,[,q])=>a+q,0);
  return '<div class="lot"><div class="chips">'+ (lines.map(([id,q])=>{const t=db().types.find(x=>x.id===+id);return '<span class="chip">'+esc(t?t.name:"")+" ×"+q+' <button data-act="minus" data-id="'+id+'">–</button><button data-act="plus" data-id="'+id+'">+</button></span>'}).join("")||'<span class="muted">Tape un type, puis valide</span>')+'</div><div class="row"><button class="btn" data-act="clear">Vider</button><button class="btn red" data-act="validate" '+(n?"":"disabled")+">Valider"+(n?" · "+n:"")+"</button></div></div>";
}
function viewStaff(){
  const open=openSessions(); const cur=open.find(s=>s.id===S.sessionId)||open[0];
  return '<header class="top">'+mark()+'<div class="meta"><b id="clock">'+clock()+'</b><span class="sync" id="sync">Sync</span><br><span class="dot '+(cur?"on":"")+'"></span>'+(cur?"Ouvert":"Fermé")+'<br><button class="link" data-act="logout">Quitter</button></div></header><div class="main">'+(cur?sessionPick(open)+modeSwitch()+cards():'<div class="closed"><strong>CAISSE FERMÉE</strong><span class="muted">Le gérant n’a pas ouvert.</span></div>')+"</div>"+(cur?lotBar():"");
}
function sessionPick(list){if(list.length<2)return "";return '<select data-act="pick">'+list.map(s=>'<option value="'+s.id+'" '+(s.id===S.sessionId?"selected":"")+">"+esc(s.label)+" · "+esc(frDate(s.businessDate))+"</option>").join("")+"</select>"}
function modeSwitch(){return '<div class="switch"><button class="'+(S.mode==="lot"?"on":"")+'" data-act="mode" data-mode="lot">Lot</button><button class="'+(S.mode==="direct"?"on":"")+'" data-act="mode" data-mode="direct">Une par une</button></div>'}
function nav(){
  const d=db(); const ping=d.users.some(u=>u.role!=="admin"&&(u.status==="pending"||u.resetRequested));
  const items=[["caisse","Caisse"],["recap","Récap"],["heures","Heures"],["tarifs","Tarifs"],["equipe",ping?"Équipe ·":"Équipe"],["jours","Jours"]];
  return '<nav class="nav">'+items.map(([id,l])=>'<button class="'+(S.view===id?"on":"")+" "+(id==="equipe"&&ping?"ping":"")+'" data-act="nav" data-view="'+id+'">'+l+"</button>").join("")+"</nav>";
}
function viewAdmin(){
  const body={caisse:adminCaisse,recap:adminRecap,heures:adminHeures,tarifs:adminTarifs,equipe:adminEquipe,jours:adminJours}[S.view]||adminCaisse;
  return '<div class="admin"><header class="top">'+mark()+'<div class="meta"><b id="clock">'+clock()+'</b><span class="sync" id="sync">Sync</span><br><button class="link" data-act="logout">Quitter</button></div></header><div class="main">'+body()+"</div>"+(S.view==="caisse"&&openSessions().length?lotBar():"")+nav()+"</div>";
}
function adminCaisse(){
  const open=openSessions(); const cur=open.find(s=>s.id===S.sessionId)||open[0];
  const live=cur?sum(active(db(),cur.id)):null;
  return '<div style="display:flex;justify-content:space-between;align-items:center"><h2>Caisse</h2><button class="btn slim red" data-act="open">Ouvrir</button></div><label><span>Nom de session</span><input id="label" value="Porte"></label>'+(cur?'<div class="live"><span>'+esc(cur.label)+" · "+esc(frDate(cur.businessDate))+"</span><span>"+live.qty+" · "+euro(live.cents)+"</span></div>"+sessionPick(open)+modeSwitch()+cards()+'<button class="btn block" data-act="close">Clôturer</button>':'<div class="closed"><strong>FERMÉ</strong><span class="muted">Ouvre une session pour compter.</span></div>');
}
function weekOf(iso){const d=new Date(iso+"T12:00:00Z");const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const ft=new Date(Date.UTC(d.getUTCFullYear(),0,4));const w=1+Math.round(((d-ft)/86400000-3+((ft.getUTCDay()+6)%7))/7);return d.getUTCFullYear()+"-W"+String(w).padStart(2,"0")}
function recapData(){
  const d=db(); const to=businessDate(); const fromDate=new Date(to+"T12:00:00Z"); fromDate.setUTCDate(fromDate.getUTCDate()-(S.range==="month"?30:S.range==="night"?0:7));
  const from=S.range==="night"?to:fromDate.toISOString().slice(0,10);
  const sessions=d.sessions.filter(s=>s.businessDate>=from&&s.businessDate<=to);
  const days=new Map();
  for(const s of sessions){const sm=sum(active(d,s.id));const day=days.get(s.businessDate)||{date:s.businessDate,week:weekOf(s.businessDate),qty:0,cents:0,hours:Array(24).fill(0),byType:[],labels:[]};day.qty+=sm.qty;day.cents+=sm.cents;sm.hours.forEach((n,i)=>day.hours[i]+=n);for(const r of sm.byType){const h=day.byType.find(x=>x.name===r.name);if(h){h.qty+=r.qty;h.cents+=r.cents}else day.byType.push({...r})}day.labels.push(s.label);days.set(s.businessDate,day)}
  const list=[...days.values()].sort((a,b)=>a.date.localeCompare(b.date));
  const weeks=new Map();
  for(const day of list){const w=weeks.get(day.week)||{week:day.week,qty:0,cents:0};w.qty+=day.qty;w.cents+=day.cents;weeks.set(day.week,w)}
  const entries=S.detail?d.entries.filter(e=>sessions.some(s=>s.id===e.sessionId)).sort((a,b)=>a.at.localeCompare(b.at)):[];
  return {list,weeks:[...weeks.values()],entries};
}
function adminRecap(){
  const r=recapData();
  return '<h2>Récap</h2><div class="actions" style="margin-bottom:8px"><button class="btn slim '+(S.range==="night"?"red":"")+'" data-act="range" data-range="night">Cette nuit</button><button class="btn slim '+(S.range==="week"?"red":"")+'" data-act="range" data-range="week">7 jours</button><button class="btn slim '+(S.range==="month"?"red":"")+'" data-act="range" data-range="month">30 jours</button><button class="btn slim '+(S.detail?"red":"")+'" data-act="detail">'+(S.detail?"Avec détail":"Sans détail")+"</button></div>"
  +r.weeks.map(w=>'<div class="panel"><b>'+esc(w.week)+"</b><div class=\"mono\">"+w.qty+" · "+euro(w.cents)+"</div></div>").join("")
  +r.list.map(d=>{const peak=d.hours.indexOf(Math.max(...d.hours));return '<article class="ticket"><div class="who">FIVE<i>:</i>AM</div><div class="sub">'+esc(frDate(d.date))+" · "+esc(d.labels.join(" / "))+'</div><table>'+d.byType.map(t=>"<tr><td>"+esc(t.name)+'</td><td class="n">'+t.qty+'</td><td class="n">'+euro(t.cents)+"</td></tr>").join("")+'<tr class="tot"><td>Total</td><td class="n">'+d.qty+'</td><td class="n">'+euro(d.cents)+'</td></tr></table><div class="sub">Pic '+String(peak).padStart(2,"0")+"h</div></article>"}).join("")
  +(S.detail?'<table class="plain">'+r.entries.map(e=>'<tr class="'+(e.voided?"void":"")+'"><td class="mono">'+frTime(e.at)+"</td><td>"+esc(e.typeName)+"</td><td>"+e.qty+"</td><td>"+esc(e.byName)+"</td><td>"+(e.voided?"":'<button class="btn slim" data-act="void" data-id="'+e.id+'">Annuler</button>')+"</td></tr>").join("")+"</table>":"")
  || '<p class="muted">Rien sur cette période.</p>';
}
function adminHeures(){
  const sessions=db().sessions.slice().reverse();
  return '<h2>Heures</h2><p class="lead">Coche pour superposer. De 20h à 7h.</p><div class="chart"><canvas id="chart" width="640" height="280"></canvas></div>'+sessions.map(s=>'<label class="check"><input type="checkbox" data-act="cmp" data-id="'+s.id+'" '+(S.compare.includes(s.id)?"checked":"")+"><span><b>"+esc(frDate(s.businessDate))+"</b> · "+esc(s.label)+"</span></label>").join("")||'<p class="muted">Aucune session.</p>';
}
function adminTarifs(){
  return '<h2>Tarifs</h2><div class="panel"><label><span>Nom</span><input id="tname"></label><label><span>Euros</span><input id="tprice" inputmode="decimal" placeholder="0 = gratuit"></label><button class="btn red" data-act="add-type">Ajouter</button></div>'+db().types.slice().sort((a,b)=>a.sort-b.sort).map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+ (t.kind==="free"?"Gratuit":euro(t.priceCents))+" · "+(t.active?"actif":"retiré")+'</div></div><div class="actions"><button class="btn slim" data-act="rename" data-id="'+t.id+'">Nom</button><button class="btn slim" data-act="price" data-id="'+t.id+'">Prix</button><button class="btn slim" data-act="toggle" data-id="'+t.id+'">'+(t.active?"Retirer":"Remettre")+"</button></div></div>").join("");
}
function adminEquipe(){
  const users=db().users.filter(u=>u.role!=="admin");
  return '<h2>Équipe</h2><p class="lead">PIN masqué. Tape pour l’afficher.</p>'+(users.map(u=>'<div class="row"><div><b>'+esc(u.name)+'</b><div>'+tag(u)+(u.resetRequested?' <span class="tag wait">PIN oublié</span>':"")+'</div><div class="mono">'+(S.revealed[u.id]||"••••••")+'</div></div><div class="actions">'+(u.status==="pending"?'<button class="btn slim red" data-act="approve" data-id="'+u.id+'">Valider</button><button class="btn slim" data-act="reject" data-id="'+u.id+'">Refuser</button>':"")+(u.status==="active"?'<button class="btn slim" data-act="disable" data-id="'+u.id+'">Désactiver</button>':"")+(u.status==="disabled"?'<button class="btn slim" data-act="enable" data-id="'+u.id+'">Réactiver</button>':"")+'<button class="btn slim" data-act="reveal" data-id="'+u.id+'">Voir PIN</button><button class="btn slim" data-act="temp" data-id="'+u.id+'">PIN temp.</button></div></div>').join("")||'<p class="muted">Aucune demande.</p>')+(S.temp?'<div class="panel"><h2>PIN temporaire</h2>'+dots(S.pin)+keys()+'<button class="btn red" data-act="save-temp">Donner</button></div>':"");
}
function tag(u){if(u.status==="pending")return '<span class="tag wait">En attente</span>';if(u.status==="disabled")return '<span class="tag">Désactivé</span>';if(u.status==="rejected")return '<span class="tag">Refusé</span>';return '<span class="tag">Actif</span>'}
function adminJours(){
  const open=new Set(db().settings.openDays);
  return '<h2>Jours</h2><p class="lead">Par défaut vendredi, samedi, dimanche. Avant 8h, ça compte pour la veille.</p><div class="days">'+DAYS.map((n,i)=>'<button class="'+(open.has(i)?"on":"")+'" data-act="day" data-day="'+i+'">'+n+"</button>").join("")+'</div><div class="lab">Copie de secours</div><p class="muted">Si tu changes de téléphone, exporte ici. Sinon les chiffres restent dans ce Safari.</p><button class="btn" data-act="export">Exporter</button> <button class="btn" data-act="import">Importer</button><input id="file" type="file" accept="application/json" hidden>'+(S.recovery?'<div class="ticket"><div class="who">'+esc(S.recovery)+"</div><div class=\"sub\">Code noté une fois. Il remet ton PIN.</div></div>":"")+'<div class="lab">PIN oublié gérant</div><label><span>Code de secours</span><input id="code"></label>'+dots(S.pin)+keys()+'<button class="btn" data-act="recover">Nouveau PIN gérant</button>';
}
function draw(){
  const c=document.getElementById("chart"); if(!c)return; const ctx=c.getContext("2d"); const w=c.width,h=c.height; ctx.fillStyle="#101010"; ctx.fillRect(0,0,w,h);
  const d=db(); const series=S.compare.map(id=>d.sessions.find(s=>s.id===id)).filter(Boolean).map(s=>({label:s.label,date:s.businessDate,hours:sum(active(d,s.id)).hours}));
  const max=Math.max(1,...series.flatMap(s=>NIGHT.map(hr=>s.hours[hr]||0)));
  const left=28,top=12,iw=w-left-8,ih=h-36;
  ctx.strokeStyle="#2a2a2a"; ctx.beginPath(); ctx.moveTo(left,top); ctx.lineTo(left,top+ih); ctx.lineTo(w-8,top+ih); ctx.stroke();
  ctx.fillStyle="#8f8b83"; ctx.font="11px monospace";
  NIGHT.forEach((hr,i)=>{const x=left+iw*i/(NIGHT.length-1); ctx.fillText(String(hr).padStart(2,"0"),x-6,h-8)});
  series.forEach((s,idx)=>{ctx.beginPath(); ctx.strokeStyle=STROKES[idx%4]; ctx.lineWidth=2; NIGHT.forEach((hr,i)=>{const x=left+iw*i/(NIGHT.length-1); const y=top+ih-ih*(s.hours[hr]||0)/max; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y)}); ctx.stroke()});
}
function validate(direct){
  const d=db(); const sid=S.sessionId||openSessions()[0]?.id; if(!sid)return toast("Caisse fermée");
  const lines=direct?[{typeId:direct,qty:1}]:Object.entries(S.lot).filter(([,q])=>q>0).map(([typeId,qty])=>({typeId:+typeId,qty}));
  if(!lines.length)return; const at=new Date().toISOString(); const batch=Math.random().toString(36).slice(2);
  const names=[];
  for(const line of lines){const t=d.types.find(x=>x.id===line.typeId&&x.active); if(!t)continue; d.entries.push({id:nid(d),sessionId:sid,batch,typeId:t.id,typeName:t.name,kind:t.kind,unitCents:t.priceCents,qty:line.qty,totalCents:t.priceCents*line.qty,at,byId:S.user.id,byName:S.user.name,voided:false}); names.push(t.name+" ×"+line.qty)}
  save(d); S.lot={}; toast("Validé "+frTime(at)+" · "+names.join(", "), true); render();
}
document.addEventListener("click", (e)=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const act=b.dataset.act;
  const nameEl=document.getElementById("name"); if(nameEl)S.name=nameEl.value;
  try{
    if(act==="key"){const k=b.dataset.k; const field=S.screen==="request"&&S.step===2?"pin2":"pin"; if(k==="C")S[field]=""; else if(k==="⌫")S[field]=S[field].slice(0,-1); else if(S[field].length<6)S[field]+=k; if(S.screen==="request"&&S.step===1&&S.pin.length===6)S.step=2; render(); return}
    if(act==="goto"){S.screen=b.dataset.to; S.err=""; S.pin=""; S.pin2=""; S.step=1; render(); return}
    if(act==="setup"){if(S.name.trim().length<2||S.pin.length!==6){S.err="Nom et PIN à 6 chiffres."; render(); return} const d=db(); const code="FAM-"+Math.random().toString(16).slice(2,8).toUpperCase(); d.users.push({id:nid(d),name:S.name.trim(),pin:S.pin,role:"admin",status:"active",recovery:code}); save(d); S.user=d.users[0]; S.recovery=code; S.screen="app"; S.view="jours"; S.pin=""; render(); return}
    if(act==="login"){const d=db(); const u=d.users.find(x=>x.name.toLowerCase()===S.name.trim().toLowerCase()&&x.pin===S.pin); if(!u){S.err="Nom ou PIN incorrect."; render(); return} if(u.status==="pending"){S.screen="pending"; render(); return} if(u.status!=="active"){S.err="Accès désactivé."; render(); return} S.user=u; S.pin=""; S.screen=u.mustChange?"changepin":"app"; render(); return}
    if(act==="request"){if(S.pin.length!==6||S.pin!==S.pin2){S.err="Les deux PIN ne correspondent pas."; render(); return} const d=db(); if(d.users.some(u=>u.name.toLowerCase()===S.name.trim().toLowerCase()&&u.status!=="rejected")){S.err="Nom déjà utilisé ou en attente."; render(); return} d.users.push({id:nid(d),name:S.name.trim(),pin:S.pin,role:"staff",status:"pending"}); save(d); S.screen="pending"; render(); return}
    if(act==="changepin"){if(S.pin.length!==6){S.err="6 chiffres."; render(); return} const d=db(); const u=d.users.find(x=>x.id===S.user.id); u.pin=S.pin; u.mustChange=false; u.resetRequested=false; save(d); S.user=u; S.screen="app"; S.pin=""; render(); return}
    if(act==="logout"){S.user=null; S.screen="login"; S.lot={}; render(); return}
    if(act==="mode"){S.mode=b.dataset.mode; localStorage.setItem("fam_mode",S.mode); S.lot={}; render(); return}
    if(act==="add"){const id=+b.dataset.id; if(S.mode==="direct")validate(id); else {S.lot[id]=(S.lot[id]||0)+1; render()} return}
    if(act==="plus"||act==="minus"){const id=+b.dataset.id; S.lot[id]=Math.max(0,(S.lot[id]||0)+(act==="plus"?1:-1)); render(); return}
    if(act==="clear"){S.lot={}; render(); return}
    if(act==="validate"){validate(); return}
    if(act==="undo"){const d=db(); const sid=S.sessionId||openSessions()[0]?.id; const mine=d.entries.filter(e=>e.sessionId===sid&&e.byId===S.user.id&&!e.voided); const last=mine[mine.length-1]; if(!last||Date.now()-new Date(last.at).getTime()>180000){toast("Trop tard pour annuler"); return} d.entries.filter(e=>e.batch===last.batch&&e.byId===S.user.id).forEach(e=>e.voided=true); save(d); toastEl.hidden=true; toast("Annulé"); render(); return}
    if(act==="nav"){S.view=b.dataset.view; if(S.view==="heures"&&!S.compare.length){const s=db().sessions[db().sessions.length-1]; if(s)S.compare=[s.id]} render(); return}
    if(act==="open"){const d=db(); const date=businessDate(); if(!d.settings.openDays.includes(weekdayOf(date))&&!confirm("Ce jour n'est pas ouvert. Forcer ?"))return; const label=(document.getElementById("label")||{}).value||"Porte"; const s={id:nid(d),label,businessDate:date,openedAt:new Date().toISOString(),status:"open",openedBy:S.user.name}; d.sessions.push(s); save(d); S.sessionId=s.id; render(); return}
    if(act==="close"){if(!confirm("Clôturer ?"))return; const d=db(); const s=d.sessions.find(x=>x.id===S.sessionId&&x.status==="open"); if(s){s.status="closed"; s.closedAt=new Date().toISOString()} save(d); S.view="recap"; S.range="night"; render(); return}
    if(act==="range"){S.range=b.dataset.range; render(); return}
    if(act==="detail"){S.detail=!S.detail; render(); return}
    if(act==="void"){const d=db(); const e=d.entries.find(x=>x.id===+b.dataset.id); if(e)e.voided=true; save(d); render(); return}
    if(act==="cmp"){const id=+b.dataset.id; S.compare=b.checked?[...new Set([...S.compare,id])].slice(0,4):S.compare.filter(x=>x!==id); draw(); return}
    if(act==="add-type"){const name=document.getElementById("tname").value.trim(); const cents=Math.round(Number(String(document.getElementById("tprice").value).replace(",","."))*100)||0; if(name.length<2)return toast("Nom trop court"); const d=db(); d.types.push({id:nid(d),name,priceCents:Math.max(0,cents),kind:cents?"paid":"free",active:true,sort:d.types.length}); save(d); render(); return}
    if(act==="rename"){const name=prompt("Nouveau nom"); if(!name)return; const d=db(); const t=d.types.find(x=>x.id===+b.dataset.id); if(t)t.name=name.trim(); save(d); render(); return}
    if(act==="price"){const raw=prompt("Montant en euros"); if(raw==null)return; const cents=Math.round(Number(String(raw).replace(",","."))*100)||0; const d=db(); const t=d.types.find(x=>x.id===+b.dataset.id); if(t){t.priceCents=Math.max(0,cents); t.kind=cents?"paid":"free"} save(d); render(); return}
    if(act==="toggle"){const d=db(); const t=d.types.find(x=>x.id===+b.dataset.id); if(t)t.active=!t.active; save(d); render(); return}
    if(act==="approve"||act==="reject"||act==="disable"||act==="enable"){const d=db(); const u=d.users.find(x=>x.id===+b.dataset.id); if(u)u.status=act==="approve"||act==="enable"?"active":act==="reject"?"rejected":"disabled"; save(d); render(); return}
    if(act==="reveal"){if(S.revealed[b.dataset.id]){delete S.revealed[b.dataset.id]; render(); return} const u=db().users.find(x=>x.id===+b.dataset.id); S.revealed[b.dataset.id]=u.pin; render(); setTimeout(()=>{delete S.revealed[b.dataset.id]; if(S.view==="equipe")render()},8000); return}
    if(act==="temp"){S.temp=+b.dataset.id; S.pin=""; render(); return}
    if(act==="save-temp"){if(S.pin.length!==6)return toast("6 chiffres"); const d=db(); const u=d.users.find(x=>x.id===S.temp); if(u){u.pin=S.pin; u.mustChange=true; u.status="active"; u.resetRequested=false} save(d); S.temp=null; S.pin=""; toast("PIN temporaire donné"); render(); return}
    if(act==="day"){const d=db(); const day=+b.dataset.day; const set=new Set(d.settings.openDays); set.has(day)?set.delete(day):set.add(day); d.settings.openDays=[...set]; save(d); render(); return}
    if(act==="export"){const blob=new Blob([localStorage.getItem(KEY)||"{}"],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fiveam-sauvegarde.json"; a.click(); return}
    if(act==="import"){document.getElementById("file").click(); return}
    if(act==="recover"){const d=db(); const admin=d.users.find(u=>u.role==="admin"); const code=(document.getElementById("code")||{}).value||""; if(!admin||admin.recovery!==code.trim().toUpperCase()||S.pin.length!==6){S.err="Code ou PIN invalide."; render(); return} admin.pin=S.pin; save(d); S.user=admin; S.screen="app"; S.pin=""; toast("PIN gérant changé"); render(); return}
  }catch(err){toast(err.message||"Erreur")}
});
document.addEventListener("change",e=>{
  if(e.target.dataset.act==="pick"){S.sessionId=+e.target.value; S.lot={}; render()}
  if(e.target.id==="file"&&e.target.files[0]){const f=e.target.files[0]; const r=new FileReader(); r.onload=()=>{try{const data=JSON.parse(r.result); if(!data.users)throw 0; localStorage.setItem(KEY,JSON.stringify(data)); toast("Sauvegarde reprise"); S.user=null; S.screen="login"; render()}catch(e){toast("Fichier illisible")}}; r.readAsText(f)}
});
setInterval(()=>{const c=document.getElementById("clock"); if(c)c.textContent=clock()},10000);
function show(){
  const boot=document.getElementById("boot");
  boot.hidden=true; boot.style.display="none";
  app.hidden=false; app.style.display="block";
  try{render()}catch(err){app.textContent=err.message}
}
async function start(){
  try{await pullDb()}catch(e){}
  show();
}
setTimeout(start,900);
setInterval(async()=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  try{ if(await pullDb()) render(); }catch(e){}
},4000);
</script>
